<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 896" width="1440" height="896" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8b1a7"/></marker></defs><rect width="1440" height="896" fill="#171e19"/><text x="70" y="80" font-size="36" fill="#f1f2e9" font-weight="700" text-anchor="start" >Psykologisk trygghet og prestasjonsstandarder</text><text x="70" y="122" font-size="22" fill="#a8b1a7" font-weight="400" text-anchor="start" >Etter Amy Edmondson</text><rect x="220" y="170" width="560" height="300" rx="14" fill="#171e19" stroke="#3a4a3f" stroke-width="2.5"/><text x="500.0" y="296.0" font-size="32" fill="#f1f2e9" font-weight="700" text-anchor="middle" >Komfortsonen</text><text x="500.0" y="342.0" font-size="22" fill="#a8b1a7" font-weight="400" text-anchor="middle" >Åpne og kollegiale, men</text><text x="500.0" y="372.0" font-size="22" fill="#a8b1a7" font-weight="400" text-anchor="middle" >ikke utfordret</text><rect x="796" y="170" width="560" height="300" rx="14" fill="#223020" stroke="#c4e49a" stroke-width="2.5"/><text x="1076.0" y="296.0" font-size="32" fill="#c4e49a" font-weight="700" text-anchor="middle" >Læringssonen</text><text x="1076.0" y="342.0" font-size="22" fill="#a8b1a7" font-weight="400" text-anchor="middle" >Samarbeid og læring</text><text x="1076.0" y="372.0" font-size="22" fill="#a8b1a7" font-weight="400" text-anchor="middle" >i tjeneste for høy prestasjon</text><rect x="220" y="486" width="560" height="300" rx="14" fill="#171e19" stroke="#3a4a3f" stroke-width="2.5"/><text x="500.0" y="612.0" font-size="32" fill="#f1f2e9" font-weight="700" text-anchor="middle" >Apatisonen</text><text x="500.0" y="658.0" font-size="22" fill="#a8b1a7" font-weight="400" text-anchor="middle" >Til stede, men velger</text><text x="500.0" y="688.0" font-size="22" fill="#a8b1a7" font-weight="400" text-anchor="middle" >selvbeskyttelse fremfor innsats</text><rect x="796" y="486" width="560" height="300" rx="14" fill="#2e231d" stroke="#e3a37f" stroke-width="2.5"/><text x="1076.0" y="612.0" font-size="32" fill="#e3a37f" font-weight="700" text-anchor="middle" >Angstsonen</text><text x="1076.0" y="658.0" font-size="22" fill="#a8b1a7" font-weight="400" text-anchor="middle" >Nøler med å dele idéer,</text><text x="1076.0" y="688.0" font-size="22" fill="#a8b1a7" font-weight="400" text-anchor="middle" >prøve nytt eller be om hjelp</text><line x1="220" y1="826" x2="1356" y2="826" stroke="#a8b1a7" stroke-width="2.5" marker-end="url(#a)"/><text x="220" y="864" font-size="22" fill="#a8b1a7" font-weight="400" text-anchor="start" >Prestasjonsstandarder: lav → høy</text><line x1="180" y1="786" x2="180" y2="170" stroke="#a8b1a7" stroke-width="2.5" marker-end="url(#a)"/><text x="160" y="478" font-size="22" fill="#a8b1a7" font-weight="400" text-anchor="middle" transform="rotate(-90 160 478)">Psykologisk trygghet: lav → høy</text></svg>