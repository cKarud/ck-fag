<text x="420.0" y="592.0" font-size="30" fill="#1f2a24" font-weight="700" text-anchor="middle" >4. Justere</text>
<text x="420.0" y="632.0" font-size="22" fill="#5b6b61" font-weight="400" text-anchor="middle" font-style="italic">Hva gjør vi annerledes?</text>
