<rect x="585.0" y="206.0" width="330" height="128" rx="16" fill="#ffffff" stroke="#c9d3cb" stroke-width="2.5"/>
<text x="750.0" y="262.0" font-size="30" fill="#1f2a24" font-weight="700" text-anchor="middle" >1. Legge merke til</text>
<text x="750.0" y="302.0" font-size="22" fill="#5b6b61" font-weight="400" text-anchor="middle" font-style="italic">Hva skjer med oss nå?</text>
