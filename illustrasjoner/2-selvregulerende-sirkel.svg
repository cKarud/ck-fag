<text x="1080.0" y="592.0" font-size="30" fill="#1f2a24" font-weight="700" text-anchor="middle" >2. Forstå</text>
<text x="1080.0" y="632.0" font-size="22" fill="#5b6b61" font-weight="400" text-anchor="middle" font-style="italic">Hva betyr det?</text>
<rect x="585.0" y="866.0" width="330" height="128" rx="16" fill="#2f6b45" stroke="#2f6b45" stroke-width="2.5"/>
<text x="750.0" y="922.0" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" >3. Si det høyt</text>
<text x="750.0" y="962.0" font-size="22" fill="#e3eedc" font-weight="400" text-anchor="middle" font-style="italic">Kan vi snakke om det?</text>
<rect x="600.0" y="1012.0" width="300" height="44" rx="22" fill="#e6f1df"/>
<text x="750.0" y="1041.0" font-size="20" fill="#2f6b45" font-weight="700" text-anchor="middle" >Krever psykologisk trygghet</text>
