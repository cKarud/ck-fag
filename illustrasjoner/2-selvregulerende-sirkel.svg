<rect width="1500" height="1110" fill="#ffffff"/>
<text x="80" y="90" font-size="40" fill="#1f2a24" font-weight="700" text-anchor="start" >Det selvregulerende teamet</text>
<text x="80" y="135" font-size="24" fill="#5b6b61" font-weight="400" text-anchor="start" >En enkel sirkel for hvordan team justerer seg når virkeligheten ikke følger planen</text>
