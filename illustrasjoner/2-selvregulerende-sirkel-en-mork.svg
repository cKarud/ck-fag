<path d="M551.4,863.5 A330,330 0 0 1 434.4,696.5" fill="none" stroke="#a8b1a7" stroke-width="3" marker-end="url(#ah)"/>
<path d="M434.4,503.5 A330,330 0 0 1 551.4,336.5" fill="none" stroke="#a8b1a7" stroke-width="3" marker-end="url(#ah)"/>
<rect x="585.0" y="206.0" width="330" height="128" rx="16" fill="#171e19" stroke="#3a4a3f" stroke-width="2.5"/>
<text x="750.0" y="262.0" font-size="30" fill="#f1f2e9" font-weight="700" text-anchor="middle" >1. Notice</text>
<text x="750.0" y="302.0" font-size="22" fill="#a8b1a7" font-weight="400" text-anchor="middle" font-style="italic">What is happening to us?</text>
<rect x="915.0" y="536.0" width="330" height="128" rx="16" fill="#171e19" stroke="#3a4a3f" stroke-width="2.5"/>
<text x="1080.0" y="592.0" font-size="30" fill="#f1f2e9" font-weight="700" text-anchor="middle" >2. Understand</text>
<text x="1080.0" y="632.0" font-size="22" fill="#a8b1a7" font-weight="400" text-anchor="middle" font-style="italic">What does it mean?</text>
<rect x="585.0" y="866.0" width="330" height="128" rx="16" fill="#c4e49a" stroke="#c4e49a" stroke-width="2.5"/>
<text x="750.0" y="922.0" font-size="30" fill="#182216" font-weight="700" text-anchor="middle" >3. Say it out loud</text>
<text x="750.0" y="962.0" font-size="22" fill="#2c3a26" font-weight="400" text-anchor="middle" font-style="italic">Can we talk about it?</text>
<rect x="600.0" y="1012.0" width="300" height="44" rx="22" fill="#223020"/>
<text x="750.0" y="1041.0" font-size="20" fill="#c4e49a" font-weight="700" text-anchor="middle" >Requires psychological safety</text>
<rect x="255.0" y="536.0" width="330" height="128" rx="16" fill="#171e19" stroke="#3a4a3f" stroke-width="2.5"/>
<text x="420.0" y="592.0" font-size="30" fill="#f1f2e9" font-weight="700" text-anchor="middle" >4. Adjust</text>
<text x="420.0" y="632.0" font-size="22" fill="#a8b1a7" font-weight="400" text-anchor="middle" font-style="italic">What do we do differently?</text>
<text x="750" y="592" font-size="32" fill="#c4e49a" font-weight="700" text-anchor="middle" >Self-regulating</text>
<text x="750" y="632" font-size="32" fill="#c4e49a" font-weight="700" text-anchor="middle" >team</text>
