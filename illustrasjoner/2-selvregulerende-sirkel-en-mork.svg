<rect width="1500" height="1110" fill="#171e19"/>
<text x="80" y="90" font-size="40" fill="#f1f2e9" font-weight="700" text-anchor="start" >The self-regulating team</text>
<text x="80" y="135" font-size="24" fill="#a8b1a7" font-weight="400" text-anchor="start" >A simple cycle for how teams adjust when reality doesn't follow the plan</text>
<path d="M948.6,336.5 A330,330 0 0 1 1065.6,503.5" fill="none" stroke="#a8b1a7" stroke-width="3" marker-end="url(#ah)"/>
